<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeMisteryRL</title>

<link rel="stylesheet" href="./PokeMisteryRL.css">
</head>

<body>

<main id="gameBox">

  <!-- MENU -->
  <section id="menu">
    <div class="menu-box">
      <h1>⚡ PokeMisteryRL</h1>
      <p>CORE 1 + CORE 2<br>GitHub Pages</p>
      <div id="homeActions">
        <button type="button" id="adventureButton">
          🧭 AVVENTURA
        </button>
        <button type="button" id="campaignsButton">
          📜 CAMPAGNE
        </button>
      </div>
      <div id="regionSelect" class="hidden">
        <h2>SCEGLI LA REGIONE</h2>
        <p>Inizia il tuo viaggio da qui.</p>
        <button type="button" class="region-choice" data-region="kanto">
          🌿 KANTO
          <small>La prima regione</small>
        </button>
        <button type="button" id="backHomeButton">
          ◀ INDIETRO
        </button>
      </div>
      <div id="campaignSelect" class="hidden mode-select-box">
        <h2>📜 CAMPAGNE</h2>
        <p>Qui troverai campagne con storie, mappe e obiettivi speciali.</p>
        <button type="button" id="testCampaignButton" class="region-choice campaign-choice">
          🧪 TEST
          <small>Stessa struttura della modalità Avventura</small>
        </button>
        <button type="button" id="backCampaignHomeButton">◀ INDIETRO</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden">

    <main class="main-layout">
      <div class="adventure-shell">
      <div class="map-wrap">

        <svg
          id="mapSvg"
          aria-hidden="true"
        ></svg>

        <div
          id="map"
          aria-label="Mappa della run"
        ></div>

        <button id="mapFloorButton" type="button" aria-label="Piano corrente" title="Piano corrente">PIANO: 1</button>
        <div class="map-utility-actions">
          <button id="mapBackpackButton" type="button" onclick="toggleInventory()" aria-label="Apri o chiudi zaino" title="Zaino">🎒</button>
          <button id="mapMenuButton" type="button" onclick="goMenu()" aria-label="Torna al menu" title="Menu">☰</button>
          <button id="mapResetButton" type="button" onclick="quickReset()" aria-label="Ricomincia la run" title="Reset run">↻</button>
        </div>

      </div>

      <!-- Il CORE costruisce qui il pannello inferiore, nello stesso scenario della mappa. -->
      <div id="bottomContainer"></div>
      </div>
    </main>

  </section>

  <!-- MODALE PRINCIPALE -->
  <div id="modal" class="hidden">
    <div id="modalContent"></div>
  </div>

  <!-- PREVIEW POKÉMON -->
  <div id="pokePreview" class="hidden">
    <div class="preview-box">

      <button type="button" class="pp-close" onclick="closeTeamPreview();busy=0;PokeMisteryRL.UI.render();">✕</button>
      <header class="pp-profile-head">
        <div class="pp-sprite-frame"><img id="ppSprite" src="" alt=""></div>
        <div class="pp-identity"><span id="ppLevel">LV 1</span><h2 id="ppName">—</h2><div id="ppTypes"></div></div>
      </header>
      <section class="pp-health"><div class="pp-health-label"><b>PS</b><span id="ppHpText">0/0</span></div><div class="bar"><div id="ppHpFill" style="width:100%"></div></div></section>
      <section class="pp-stats"><div><small>ATTACCO</small><b id="ppk">0</b></div><div><small>DIFESA</small><b id="ppDef">0</b></div><div><small>VELOCITÀ</small><b id="ppSpd">0</b></div></section>
      <div id="ppCustomContent"></div>

    </div>
  </div>

  <!-- INFO POKÉMON -->
  <div id="pokeInfo" class="hidden">

    <div class="modal-box">

      <div style="text-align:center">

        <img
          id="pokeInfoSprite"
          src=""
          alt=""
          style="
            width:80px;
            height:80px;
            object-fit:contain;
            image-rendering:pixelated
          "
        >

        <h2 id="pokeInfoName">—</h2>

        <div id="pokeInfoTypes"></div>

      </div>

      <p>
        HP <span id="piHp">0/0</span>
      </p>

      <p>
        ATK
        <span id="piAtk">0</span>
        <span id="piAtkR"></span>
      </p>

      <p>
        DEF
        <span id="piDef">0</span>
        <span id="piDefR"></span>
      </p>

      <p>
        SPD
        <span id="piSpd">0</span>
        <span id="piSpdR"></span>
      </p>

      <p>
        CRIT <span id="piCrit">0</span>
      </p>

      <p>
        EVA <span id="piEva">0</span>
      </p>

      <p>
        STUN <span id="piStun">0</span>
      </p>

      <div id="pokeInfoActions"></div>

      <button
        type="button"
        onclick="closePokeInfo()"
      >
        CHIUDI
      </button>

    </div>

  </div>

</main>

<div id="fatal"></div>

<!-- =========================================================
     FILE DEL REPOSITORY
     ========================================================= -->

<script src="./DB_PKM.js"></script>
<script src="./MOSSE_PKM.js"></script>
<script src="./DB_MODES.js"></script>

<!-- CORE 1 FIXATO -->
<script src="./CORE_0.js"></script>

<!-- REGIONI -->
<script src="./LEVEL_SYSTEM_REGION.js"></script>
<script src="./SKILL_SYSTEM_REGION.js"></script>
<script src="./DB_ITEMS.js"></script>

<script>
/*
 * Controllo leggero post-caricamento.
 * Non costruisce una seconda mappa e non sostituisce nessuna funzione del CORE.
 */
window.addEventListener("error", function(e){
  const box = document.getElementById("fatal");
  if(!box) return;

  box.style.display = "block";
  box.textContent =
    "ERRORE JAVASCRIPT\n\n" +
    (e.error?.stack || e.message || String(e.error || e));
});

window.addEventListener("unhandledrejection", function(e){
  const box = document.getElementById("fatal");
  if(!box) return;

  box.style.display = "block";
  box.textContent =
    "PROMISE REJECTION\n\n" +
    (e.reason?.stack || e.reason || String(e.reason));
});

console.log("PokeMisteryRL");
console.log("PKM_ALL:", !!window.PKM_ALL);
console.log("SKILL_DB:", typeof SKILL_DB !== "undefined");
console.log("CORE 1 ready:", !!window.PokeMisteryRL_CoreBridge?.part1Ready);
console.log("CORE 2 ready:", !!window.PokeMisteryRL_CoreBridge?.part2Ready);
console.log("startPokemon:", typeof window.PokeMisteryRL?.Run?.startPokemon);

(function(){
  const adventureButton = document.getElementById("adventureButton");
  const campaignsButton = document.getElementById("campaignsButton");
  const homeActions = document.getElementById("homeActions");
  const regionSelect = document.getElementById("regionSelect");
  const campaignSelect = document.getElementById("campaignSelect");
  const backHomeButton = document.getElementById("backHomeButton");
  const kantoButton = document.querySelector('[data-region="kanto"]');
  const testCampaignButton = document.getElementById("testCampaignButton");

  adventureButton?.addEventListener("click", function(){
    homeActions?.classList.add("hidden");
    regionSelect?.classList.remove("hidden");
  });

  campaignsButton?.addEventListener("click", function(){
    homeActions?.classList.add("hidden");
    campaignSelect?.classList.remove("hidden");
  });

  backHomeButton?.addEventListener("click", function(){
    regionSelect?.classList.add("hidden");
    homeActions?.classList.remove("hidden");
  });

  document.getElementById("backCampaignHomeButton")?.addEventListener("click", function(){
    campaignSelect?.classList.add("hidden");
    homeActions?.classList.remove("hidden");
  });

  const startKantoAdventure = function(starterId, modeName = "avventura"){
    try {
      if(
        !window.PokeMisteryRL ||
        !window.PokeMisteryRL.Run ||
        typeof window.PokeMisteryRL.Run.startPokemon !== "function"
      ){
        throw new Error(
          "PokeMisteryRL.Run.startPokemon() non disponibile."
        );
      }

      window.PokeMisteryRL.Run.startPokemon(starterId, modeName);
      if(window.PKM_RUN){
        window.PKM_RUN.region = "kanto";
      }
    } catch(err) {
      const box = document.getElementById("fatal");
      if(box){
        box.style.display = "block";
        box.textContent =
          "ERRORE DURANTE LA RUN\n\n" +
          (err?.stack || err?.message || String(err));
      }
      console.error(err);
    }
  };

  window.chooseKantoStarter = function(starterId){
    startKantoAdventure(Number(starterId));
  };
  window.chooseCampaignStarter = function(starterId, modeName){
    startKantoAdventure(Number(starterId), modeName || "test");
  };

  const openKantoStarterModal = function(modeName = "avventura", title = "Avventura"){ 
    // Apriamo prima Kanto: la mappa resta visibile dietro la scelta starter.
    startKantoAdventure(1, modeName);

    const modal = window.PokeMisteryRL?.Helpers?.modal;
    if(typeof modal !== "function") return;

    modal(`
      <div class="center starter-picker starter-modal-picker">
        <div class="starter-picker-head">
          <h2>SCEGLI IL TUO STARTER</h2>
          <p>Kanto · scegli il tuo Starter per ${title}.</p>
        </div>
        <div class="starter-picker-list">
          <button type="button" class="starter-choice starter-bulbasaur" onclick="chooseCampaignStarter(1, '${modeName}')">
            <img src="https://cdn.jsdelivr.net/gh/ilGuru96/spritemon/bulbasaur.png" alt="Bulbasaur">
            <b>#001 BULBASAUR</b><small>ERBA · VELENO</small>
          </button>
          <button type="button" class="starter-choice starter-charmander" onclick="chooseCampaignStarter(4, '${modeName}')">
            <img src="https://cdn.jsdelivr.net/gh/ilGuru96/spritemon/charmander.png" alt="Charmander">
            <b>#004 CHARMANDER</b><small>FUOCO</small>
          </button>
          <button type="button" class="starter-choice starter-squirtle" onclick="chooseCampaignStarter(7, '${modeName}')">
            <img src="https://cdn.jsdelivr.net/gh/ilGuru96/spritemon/squirtle.png" alt="Squirtle">
            <b>#007 SQUIRTLE</b><small>ACQUA</small>
          </button>
        </div>
      </div>
    `);
  };

  kantoButton?.addEventListener("click", () => openKantoStarterModal("avventura", "Avventura"));
  testCampaignButton?.addEventListener("click", () => startKantoAdventure(null, "test"));
})();
</script>

</body>
</html>

 <style>
/* ============================================================
   PokeMisteryRL
   STYLE REWORK
   CORE JS COMPATIBLE
   ============================================================ */

/* ============================================================
   01. RESET / BASE
   ============================================================ */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:#050914;
}

body{
    min-height:100vh;

    margin:0;
    padding:10px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #10213d 0%,
            #08111f 35%,
            #050914 75%
        );

    color:#f5f8ff;

    font-family:
        monospace,
        "Courier New",
        sans-serif;

    text-align:center;

    overflow-x:hidden;
}

button{
    appearance:none;

    border:1px solid #41658e;
    border-radius:8px;

    padding:8px 14px;
    margin:4px;

    background:
        linear-gradient(
            180deg,
            #294b78,
            #183252
        );

    color:#fff;

    font-family:inherit;
    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease,
        box-shadow .12s ease;
}

button:hover{
    background:
        linear-gradient(
            180deg,
            #38679f,
            #21446f
        );

    border-color:#5d91c8;

    box-shadow:
        0 0 12px rgba(70,150,255,.18);
}

button:active{
    transform:scale(.96);
}

button.danger{
    background:
        linear-gradient(
            180deg,
            #8b3838,
            #602525
        );

    border-color:#b85b5b;
}

button.danger:hover{
    background:
        linear-gradient(
            180deg,
            #a84747,
            #742d2d
        );
}

/* ============================================================
   02. UTILITIES
   ============================================================ */

.hidden{
    display:none!important;
}

/* ============================================================
   03. MENU
   ============================================================ */

#menu{
    width:min(100%,450px);

    min-height:100vh;

    margin:0 auto;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:8px;
}

#menu h1{
    margin:0 0 20px;

    color:#55d9ff;

    font-size:24px;
    letter-spacing:2px;

    text-shadow:
        0 0 8px rgba(0,220,255,.55),
        0 0 24px rgba(0,220,255,.2);
}

#menu button{
    min-width:210px;
}

/* ============================================================
   04. GAME
   ============================================================ */

#game{
    width:100%;
}

#gameBox{
    width:100%;
    max-width:450px;

    margin:0 auto;
}

/* ============================================================
   05. MAP WRAPPER
   ============================================================ */

.map-wrap{
    position:relative;

    width:100%;
    min-height:440px;

    padding:14px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(20,65,105,.4),
            transparent 55%
        ),
        #081525;

    border:1px solid #315579;
    border-radius:16px;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.35),
        0 8px 25px rgba(0,0,0,.25);
}

/* ============================================================
   MAP SVG
   ============================================================ */

#mapSvg{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:0;
}

/* ============================================================
   MAP
   ============================================================ */

#map{
    position:relative;

    z-index:1;

    width:100%;
}

.map-row{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;

    margin:15px 0;
}

.node{
    position:relative;

    width:46px;
    height:46px;

    flex:0 0 46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid #315579;

    background:
        radial-gradient(
            circle,
            #182c45 0%,
            #0b1422 75%
        );

    color:#fff;

    font-size:20px;

    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

.node:hover{
    transform:scale(1.06);
}

.node.available{
    border-color:#ffd43b;

    background:
        radial-gradient(
            circle,
            #3b3505,
            #171600
        );

    box-shadow:
        0 0 7px #ffd43b,
        0 0 18px rgba(255,204,0,.45);

    transform:scale(1.12);
}

.node.current{
    border-color:#00e5ff;

    background:
        radial-gradient(
            circle,
            #063b47,
            #061b23
        );

    box-shadow:
        0 0 8px #00e5ff,
        0 0 20px rgba(0,229,255,.4);
}

.node.done{
    opacity:.45;
}

.node.locked{
    opacity:.22;

    pointer-events:none;
}

/* ============================================================
   MAP CONNECTIONS
   ============================================================ */

.map-line{
    stroke:#315579;

    stroke-width:2;

    opacity:.55;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

.map-line.available{
    stroke:#ffd43b;

    stroke-width:2.5;

    opacity:1;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

/* ============================================================
   06. BOTTOM CONTAINER
   ============================================================ */

#bottomContainer{
    width:100%;

    margin-top:8px;
    padding:8px;

    background:
        linear-gradient(
            145deg,
            #112746,
            #0a182c
        );

    border:1px solid #294b70;
    border-radius:16px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.035);
}

/* ============================================================
   07. MAIN HUD GRID
   ============================================================ */

.bottom-v8{
    width:100%;

    min-height:142px;

    display:grid;

    grid-template-columns:
        17fr
        59fr
        24fr;

    gap:8px;

    text-align:left;
}

/* ============================================================
   08. LEFT HUD
   ============================================================ */

.b8-left{
    width:100%;

    min-width:0;

    display:flex;

    flex-direction:column;

    gap:5px;
}

/* ============================================================
   STARTER 1
   ============================================================ */

#starter1Box{
    width:100%;
    height:68px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle,
            #182d4c,
            #071020
        );

    border:2px solid #ffd43b;
    border-radius:12px;

    box-shadow:
        0 0 8px rgba(255,212,59,.12);

    cursor:pointer;
}

#starter1Box img{
    width:56px;

    object-fit:contain;

    image-rendering:pixelated;
}

/* ============================================================
   STARTER 2

#starter2Slot{

.b8-center{

.b8-top{

    height:22px;

    flex:0 0 22px;

.b8-btn{

/* ============================================================

   ============================================================ */

#eventLog{

    font-size:10px;

    text-align:center;

    pointer-events:none;
}

/* ============================================================
   12. BATTLE
   ============================================================ */

#battleFinal{
    width:100%;

    font-size:12px;
}

.bf-top{
    display:flex;

    gap:8px;

    margin-bottom:8px;
}

.bf-hp{
    flex:1;

    padding:5px;

    background:#03070c;

    border:1px solid #315579;
    border-radius:7px;
}

.bf-field{
    display:flex;

    align-items:center;
    justify-content:space-around;

    margin:8px 0;
    padding:12px;

    background:
        radial-gradient(
            ellipse at center,
            #112b45,
            #071321
        );

    border:1px solid #213e5d;
    border-radius:10px;
}

.bf-sprite{
    position:relative;
}

.bf-sprite img{
    width:72px;
    height:72px;

    object-fit:contain;

    image-rendering:pixelated;
}

.bf-sprite.hit{
    animation:hitShake .25s ease;
}

@keyframes hitShake{
    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    75%{
        transform:translateX(6px);
    }
}

.bf-logRow{
    display:flex;

    gap:6px;

    align-items:stretch;
}

.bf-log{
    flex:1;

    height:60px;

    overflow:auto;

    padding:5px;

    background:#02050a;

    border:1px solid #1c334d;
    border-radius:7px;

    color:#d9e8f5;

    font-size:11px;

    text-align:left;
}

.bf-fleeBox{
    display:flex;

    align-items:center;
    justify-content:center;
}

.btn-flee{
    min-width:55px;

    padding:7px;

    background:#663434;
}

/* ============================================================
   BATTLE TEAM
   ============================================================ */

.bf-team{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:8px;
}

.team-label{
    grid-column:1/-1;

    color:#80cfff;

    font-size:10px;
    font-weight:bold;

    text-align:left;
}

.poke-card{
    min-width:0;

    padding:5px;

    background:#03070c;

    border:1px solid #294967;
    border-radius:8px;

    text-align:center;
}

.poke-card.empty{
    opacity:.5;
}

.poke-card img{
    width:40px;
    height:40px;

    object-fit:contain;

    image-rendering:pixelated;
}

.poke-name{
    overflow:hidden;

    font-size:9px;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.poke-lv{
    margin-top:2px;

    color:#a9bfd5;

    font-size:9px;
}

.mini-bar{
    height:5px;

    margin-top:3px;

    overflow:hidden;

    background:#000;

    border-radius:4px;
}

.mini-bar > div{
    height:100%;

    background:#28d67b;

    transition:width .25s ease;
}

/* ============================================================
   DAMAGE NUMBERS
   ============================================================ */

.dmg-num{
    position:absolute;

    left:50%;
    top:10px;

    z-index:10;

    transform:translateX(-50%);

    pointer-events:none;

    font-size:16px;
    font-weight:bold;

    animation:damageFloat .9s ease forwards;

    text-shadow:
        0 2px 3px #000;
}

.dmg-num.crit{
    font-size:20px;
}

.dmg-num.heal{
    font-size:16px;
}

@keyframes damageFloat{
    0%{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-35px)
            scale(1.15);
    }
}

#modal{

/* ============================================================
   01. RESET / BASE
   ============================================================ */

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:#050914;
}

body{
    min-height:100vh;

    margin:0;
    padding:10px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #10213d 0%,
            #08111f 35%,
            #050914 75%
        );

    color:#f5f8ff;

    font-family:
        monospace,
        "Courier New",
        sans-serif;

    text-align:center;

    overflow-x:hidden;
}

button{
    appearance:none;

    border:1px solid #41658e;
    border-radius:8px;

    padding:8px 14px;
    margin:4px;

    background:
        linear-gradient(
            180deg,
            #294b78,
            #183252
        );

    color:#fff;

    font-family:inherit;
    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease,
        box-shadow .12s ease;
}

button:hover{
    background:
        linear-gradient(
            180deg,
            #38679f,
            #21446f
        );

    border-color:#5d91c8;

    box-shadow:
        0 0 12px rgba(70,150,255,.18);
}

button:active{
    transform:scale(.96);
}

button.danger{
    background:
        linear-gradient(
            180deg,
            #8b3838,
            #602525
        );

    border-color:#b85b5b;
}

button.danger:hover{
    background:
        linear-gradient(
            180deg,
            #a84747,
            #742d2d
        );
}

/* ============================================================
   02. UTILITIES
   ============================================================ */

.hidden{
    display:none!important;
}

/* ============================================================
   03. MENU
   ============================================================ */

#menu{
    width:min(100%,450px);

    min-height:100vh;

    margin:0 auto;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:8px;
}

#menu h1{
    margin:0 0 20px;

    color:#55d9ff;

    font-size:24px;
    letter-spacing:2px;

    text-shadow:
        0 0 8px rgba(0,220,255,.55),
        0 0 24px rgba(0,220,255,.2);
}

#menu button{
    min-width:210px;
}

/* ============================================================
   04. GAME
   ============================================================ */

#game{
    width:100%;
}

#gameBox{
    width:100%;
    max-width:450px;

    margin:0 auto;
}

/* ============================================================
   05. MAP WRAPPER
   ============================================================ */

.map-wrap{
    position:relative;

    width:100%;
    min-height:440px;

    padding:14px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(20,65,105,.4),
            transparent 55%
        ),
        #081525;

    border:1px solid #315579;
    border-radius:16px;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.35),
        0 8px 25px rgba(0,0,0,.25);
}

/* ============================================================
   MAP SVG
   ============================================================ */

#mapSvg{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    pointer-events:none;

    z-index:0;
}

/* ============================================================
   MAP
   ============================================================ */

#map{
    position:relative;

    z-index:1;

    width:100%;
}

.map-row{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:14px;

    margin:15px 0;
}

.node{
    position:relative;

    width:46px;
    height:46px;

    flex:0 0 46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:2px solid #315579;

    background:
        radial-gradient(
            circle,
            #182c45 0%,
            #0b1422 75%
        );

    color:#fff;

    font-size:20px;

    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

.node:hover{
    transform:scale(1.06);
}

.node.available{
    border-color:#ffd43b;

    background:
        radial-gradient(
            circle,
            #3b3505,
            #171600
        );

    box-shadow:
        0 0 7px #ffd43b,
        0 0 18px rgba(255,204,0,.45);

    transform:scale(1.12);
}

.node.current{
    border-color:#00e5ff;

    background:
        radial-gradient(
            circle,
            #063b47,
            #061b23
        );

    box-shadow:
        0 0 8px #00e5ff,
        0 0 20px rgba(0,229,255,.4);
}

.node.done{
    opacity:.45;
}

.node.locked{
    opacity:.22;

    pointer-events:none;
}

/* ============================================================
   MAP CONNECTIONS
   ============================================================ */

.map-line{
    stroke:#315579;

    stroke-width:2;

    opacity:.55;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

.map-line.available{
    stroke:#ffd43b;

    stroke-width:2.5;

    opacity:1;

    stroke-dasharray:6 5;

    stroke-linecap:round;
}

/* ============================================================
   06. BOTTOM CONTAINER
   ============================================================ */

#bottomContainer{
    width:100%;

    margin-top:8px;
    padding:8px;

    background:
        linear-gradient(
            145deg,
            #112746,
            #0a182c
        );

    border:1px solid #294b70;
    border-radius:16px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.25),

}

.team-slot img{

    height:100%;

/* ============================================================

   ============================================================ */

.b8-actions{

    display:flex;

    justify-content:center;

    gap:5px;

.b8-btn{

    height:30px;

    margin:0;
    padding:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid #315f93;

/* ============================================================
   11. GENERAL EVENT LOG
   ============================================================ */

#eventLog{

    margin-top:5px;

    color:#8edfff;

    font-size:10px;

    text-align:center;

    pointer-events:none;
}

/* ============================================================
   12. BATTLE
   ============================================================ */

#battleFinal{
    width:100%;

    font-size:12px;
}

.bf-top{
    display:flex;

    gap:8px;

    margin-bottom:8px;
}

.bf-hp{
    flex:1;

    padding:5px;

    background:#03070c;

    border:1px solid #315579;
    border-radius:7px;
}

.bf-field{
    display:flex;

    align-items:center;
    justify-content:space-around;

    margin:8px 0;
    padding:12px;

    background:
        radial-gradient(
            ellipse at center,
            #112b45,
            #071321
        );

    border:1px solid #213e5d;
    border-radius:10px;
}

.bf-sprite{
    position:relative;
}

.bf-sprite img{
    width:72px;
    height:72px;

    object-fit:contain;

    image-rendering:pixelated;
}

.bf-sprite.hit{
    animation:hitShake .25s ease;
}

@keyframes hitShake{
    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    75%{
        transform:translateX(6px);
    }
}

.bf-logRow{
    display:flex;

    gap:6px;

    align-items:stretch;
}

.bf-log{
    flex:1;

    height:60px;

    overflow:auto;

    padding:5px;

    background:#02050a;

    border:1px solid #1c334d;
    border-radius:7px;

    color:#d9e8f5;

    font-size:11px;

    text-align:left;
}

.bf-fleeBox{
    display:flex;

    align-items:center;
    justify-content:center;
}

.btn-flee{
    min-width:55px;

    padding:7px;

    background:#663434;
}

/* ============================================================
   BATTLE TEAM
   ============================================================ */

.bf-team{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:6px;

    margin-top:8px;
}

.team-label{
    grid-column:1/-1;

    color:#80cfff;

    font-size:10px;
    font-weight:bold;

    text-align:left;
}

.poke-card{
    min-width:0;

    padding:5px;

    background:#03070c;

    border:1px solid #294967;
    border-radius:8px;

    text-align:center;
}

.poke-card.empty{
    opacity:.5;
}

.poke-card img{
    width:40px;
    height:40px;

    object-fit:contain;

    image-rendering:pixelated;
}

.poke-name{
    overflow:hidden;

    font-size:9px;

    white-space:nowrap;
    text-overflow:ellipsis;
}

.poke-lv{
    margin-top:2px;

    color:#a9bfd5;

    font-size:9px;
}

.mini-bar{
    height:5px;

    margin-top:3px;

    overflow:hidden;

    background:#000;

    border-radius:4px;
}

.mini-bar > div{
    height:100%;

    background:#28d67b;

    transition:width .25s ease;
}

/* ============================================================
   DAMAGE NUMBERS
   ============================================================ */

.dmg-num{
    position:absolute;

    left:50%;
    top:10px;

    z-index:10;

    transform:translateX(-50%);

    pointer-events:none;

    font-size:16px;
    font-weight:bold;

    animation:damageFloat .9s ease forwards;

    text-shadow:
        0 2px 3px #000;
}

.dmg-num.crit{
    font-size:20px;
}

.dmg-num.heal{
    font-size:16px;
}

@keyframes damageFloat{
    0%{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-35px)
            scale(1.15);
    }
}

/* ============================================================

#modal{

    padding:2px 3px;border:1px solid #29445f;border-radius:5px;background:#071321;font-size:6px;
}
.inventory-icon{text-align:center;font-size:10px;}
.inventory-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inventory-empty{padding:4px;text-align:center;color:#6d819b;font-size:6px;}
.b8-inventory-incubator{
    padding:3px;text-align:center;border:1px solid #29445f;border-radius:5px;background:#071321;font-size:6px;
}
.b8-inventory-close{
    width:100%;margin:0;padding:5px 2px;font-size:7px;
}
.run-log-panel{
    width:100%;margin-top:6px;border:1px solid #294b70;border-radius:10px;background:#071321;overflow:hidden;text-align:left;
}
.run-log-toggle{
    width:100%;margin:0;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;

    display:none;max-height:180px;overflow-y:auto;padding:6px 8px;border-top:1px solid #294b70;font-size:8px;color:#b9d8ef;
}
.run-log-line{padding:3px 0;border-bottom:1px solid rgba(49,85,121,.18);}
.run-log-line:last-child{border-bottom:0;}

/* Preview */

/*
 * S1 / S2 — orientamento specchiato
 * Applicato sia al BOTTOM sia alla BATTLE UI.
 *
 * L'enemy NON viene modificato.
 */

/* BOTTOM */
#starter1Box img,
#starter2Slot img,
#teamViewerSprite{
  transform:scaleX(-1);
}

/* BATTLE */
.bf-sprite.s1 img,
.bf-sprite.s2 img{
  transform:scaleX(-1);
}

#map .node{
  position:relative !important;
  overflow:visible !important;
}
#map .node .map-enemy-preview-final{
  position:absolute !important;
  left:50% !important;
  top:54% !important;
  width:42px !important;
  height:42px !important;
  max-width:42px !important;
  max-height:42px !important;
  transform:translate(-50%,-50%) !important;
  object-fit:contain !important;
  display:block !important;
  visibility:visible !important;
  opacity:1 !important;
  z-index:30 !important;
  pointer-events:none !important;
}
#map .node .map-sword-final{
  position:absolute !important;
  top:8px !important;
  right:-3px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  width:22px !important;
  height:22px !important;
  font-size:16px !important;
  line-height:1 !important;
  z-index:40 !important;
  pointer-events:none !important;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.95)) !important;
}
#map .node.boss .map-enemy-preview-final{
  width:46px !important;
  height:46px !important;
  max-width:46px !important;
  max-height:46px !important;
}

#map .node .map-enemy-preview-crop{
  position:absolute !important;
  left:50% !important;
  top:54% !important;

  width:58px !important;
  height:58px !important;

  transform:translate(-50%,-50%) !important;

  display:block !important;
  overflow:visible !important;

  z-index:30 !important;
  pointer-events:none !important;
}

#map .node .map-enemy-preview-final{
  position:absolute !important;

  left:50% !important;
  top:50% !important;

  /*
   * Lo sprite viene centrato esattamente nella finestra di crop.
   * object-position evita spostamenti dovuti alla dimensione del box PNG.
   */
  width:58px !important;
  height:58px !important;
  max-width:none !important;
  max-height:none !important;

  transform:translate(-50%,-50%) scale(1.15) !important;

  object-fit:contain !important;
  object-position:50% 50% !important;

  display:block !important;
  visibility:visible !important;
  opacity:1 !important;

  image-rendering:auto !important;
}

#map .node.boss .map-enemy-preview-crop{
  width:64px !important;
  height:64px !important;
}

#map .node.boss .map-enemy-preview-final{
  width:64px !important;
  height:64px !important;
}

#map .node .map-enemy-preview-crop,
#map .node.boss .map-enemy-preview-crop{
  left:50% !important;
  top:calc(54% - 20px) !important;
  transform:translate(-50%,-50%) !important;
}

/*

/* Schermata evoluzione */
.evolution-modal{

  grid-template-columns:1fr 26px 20px 1fr;
  align-items:center;
  gap:3px;
  padding:12px 7px;
  border:1px solid rgba(104,222,255,.48);
  border-radius:12px;
  background:rgba(3,12,25,.55);
}
.evolution-form{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  min-width:0;
  font-size:10px;
}
.evolution-form img{
  width:78px;
  height:78px;
  object-fit:contain;
  image-rendering:pixelated;
}
.evolution-arrow{font-size:20px;color:#7fe9ff;font-weight:900}
.evolution-flash{font-size:22px;color:#fff4aa;animation:evoPulse 1s ease-in-out infinite}
.evolution-caption{margin:12px 0 6px;font-size:10px;opacity:.78}
.evolution-confirm{width:100%;margin:5px 0 0;background:linear-gradient(90deg,#00a8d6,#375dff) !important}
.evolution-modal.is-evolving .evolution-from{animation:evoLeave .85s ease-in forwards}
.evolution-modal.is-evolving .evolution-to{animation:evoArrive .85s ease-out forwards}
.evolution-modal.is-evolving .evolution-flash{animation:evoBurst .85s ease-out forwards}
.evolution-modal.is-evolving .evolution-arrow,
.evolution-modal.is-evolving .evolution-caption,
.evolution-modal.is-evolving .evolution-confirm{opacity:0;transition:opacity .15s ease}
.evolution-result{display:grid;justify-items:center;gap:12px}.evolution-result>img{width:120px;height:120px;object-fit:contain;image-rendering:pixelated}.evolution-result h2{margin:0;max-width:440px}.evolution-result .evolution-confirm{max-width:360px}
